name: Build SSH Server KPM package

on:
  push:
    branches:
      - main
    paths:
      - 'package-src/ssh-server/**'
      - '.github/workflows/build-ssh-server.yml'

permissions:
  contents: write

concurrency:
  group: kindlebrew-package-writers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Fetch pinned Dropbear source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          curl -fL --retry 3 \
            -o build/dropbear-2026.94.tar.bz2 \
            https://matt.ucc.asn.au/dropbear/releases/dropbear-2026.94.tar.bz2
          echo 'e098034a843699200c8c977a991fff73159735bf795d5f72ef672c41a6b1ae81  build/dropbear-2026.94.tar.bz2' | sha256sum -c -

      - name: Build static ARMv7 Dropbear
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/dropbear-2026.94 build/ssh-server
          mkdir -p build/ssh-server/bin

          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/work" -w /work alpine:3.23 sh -euxc '
              apk add --no-cache build-base linux-headers bzip2 file libxcrypt-dev
              tar -xjf build/dropbear-2026.94.tar.bz2 -C build
              cd build/dropbear-2026.94

              ./configure \
                --enable-static \
                --disable-zlib \
                --disable-harden

              make -j2 PROGRAMS="dropbear dropbearkey scp"
              make PROGRAMS="dropbear dropbearkey scp" strip

              file dropbear dropbearkey scp
              ./dropbear -V

              rm -rf /tmp/kindlebrew-ssh-smoke
              mkdir -p /tmp/kindlebrew-ssh-smoke/keys
              chmod 700 /tmp/kindlebrew-ssh-smoke/keys
              : > /tmp/kindlebrew-ssh-smoke/keys/authorized_keys
              chmod 600 /tmp/kindlebrew-ssh-smoke/keys/authorized_keys
              ./dropbearkey -t ed25519 -f /tmp/kindlebrew-ssh-smoke/hostkey

              ./dropbear \
                -F -E -s -j -k -m \
                -r /tmp/kindlebrew-ssh-smoke/hostkey \
                -D /tmp/kindlebrew-ssh-smoke/keys \
                -p 127.0.0.1:22994 \
                -P /tmp/kindlebrew-ssh-smoke/pid \
                >/tmp/kindlebrew-ssh-smoke/server.log 2>&1 &
              smoke_pid=$!
              sleep 1
              kill -0 "$smoke_pid"
              kill -TERM "$smoke_pid"
              wait "$smoke_pid" || true

              cp dropbear /work/build/ssh-server/bin/dropbear
              cp dropbearkey /work/build/ssh-server/bin/dropbearkey
              cp scp /work/build/ssh-server/bin/scp
              cp LICENSE /work/build/ssh-server/LICENSE.dropbear
            '

      - name: Assemble KPM package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/ssh-server/artifacts
          cp package-src/ssh-server/manifest.json build/ssh-server/manifest.json
          cp package-src/ssh-server/install.sh build/ssh-server/install.sh
          cp package-src/ssh-server/launch.sh build/ssh-server/launch.sh
          cp package-src/ssh-server/uninstall.sh build/ssh-server/uninstall.sh
          cp package-src/ssh-server/server.sh build/ssh-server/server.sh

          chmod 755 \
            build/ssh-server/install.sh \
            build/ssh-server/launch.sh \
            build/ssh-server/uninstall.sh \
            build/ssh-server/server.sh \
            build/ssh-server/bin/dropbear \
            build/ssh-server/bin/dropbearkey \
            build/ssh-server/bin/scp

          sh -n build/ssh-server/install.sh
          sh -n build/ssh-server/launch.sh
          sh -n build/ssh-server/uninstall.sh
          sh -n build/ssh-server/server.sh

          python - <<'PY'
          import os
          import tarfile

          src = 'build/ssh-server'
          out = 'packages/ssh-server/artifacts/ssh-server_2026.94.0_kindlehf.kpkg'

          with tarfile.open(out, 'w:gz', compresslevel=5) as archive:
              for root, dirs, files in os.walk(src):
                  dirs.sort()
                  files.sort()
                  for name in files:
                      path = os.path.join(root, name)
                      arcname = os.path.relpath(path, src)
                      archive.add(path, arcname=arcname)

          print('packed', out)
          PY

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          file build/ssh-server/bin/dropbear | grep -q 'ELF 32-bit.*ARM'
          file build/ssh-server/bin/dropbear | grep -q 'statically linked'

          python - <<'PY'
          import json
          import tarfile

          p = 'packages/ssh-server/artifacts/ssh-server_2026.94.0_kindlehf.kpkg'
          with tarfile.open(p, 'r:gz') as t:
              names = set(t.getnames())
              required = {
                  'manifest.json',
                  'install.sh',
                  'launch.sh',
                  'uninstall.sh',
                  'server.sh',
                  'bin/dropbear',
                  'bin/dropbearkey',
                  'bin/scp',
                  'LICENSE.dropbear',
              }
              missing = required - names
              assert not missing, missing
              m = json.load(t.extractfile('manifest.json'))

          assert m['manifest_version'] == 2
          assert m['id'] == 'ssh-server'
          assert m['version'] == [2026, 94, 0]
          assert m['supported_platforms'] == ['kindlehf']
          print('validated', p)
          PY

          sha256sum packages/ssh-server/artifacts/ssh-server_2026.94.0_kindlehf.kpkg

      - name: Commit built package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ssh-server/artifacts/ssh-server_2026.94.0_kindlehf.kpkg
          if git diff --cached --quiet; then
            echo 'Package unchanged.'
            exit 0
          fi
          git commit -m 'build: package Dropbear SSH server 2026.94'
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            if git pull --rebase origin "$branch" && git push origin "HEAD:$branch"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo 'Failed to publish generated package after 3 attempts.' >&2
          exit 1
