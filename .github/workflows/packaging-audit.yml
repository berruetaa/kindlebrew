name: KPM packaging audit

on:
  push:
    branches:
      - main
      - feat/kindle-game-engine
      - feat/kbge-chess
    paths:
      - 'manifest.json'
      - 'package-src/**'
      - 'packages/**'
      - 'tools/kpm-pack.sh'
      - 'tools/kpm-canonicalize.py'
      - 'tools/kpm-validate.sh'
      - 'tools/audit-repository.py'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'manifest.json'
      - 'package-src/**'
      - 'packages/**'
      - 'tools/kpm-pack.sh'
      - 'tools/kpm-validate.sh'
      - 'tools/audit-repository.py'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build KPM-matched libarchive 3.8.1 validator
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev liblzma-dev
          curl -fL --retry 3 \
            -o /tmp/libarchive-3.8.1.tar.xz \
            https://github.com/libarchive/libarchive/releases/download/v3.8.1/libarchive-3.8.1.tar.xz
          echo '19f917d42d530f98815ac824d90c7eaf648e9d9a50e4f309c812457ffa5496b5  /tmp/libarchive-3.8.1.tar.xz' | sha256sum -c -
          rm -rf /tmp/libarchive-3.8.1
          tar -xJf /tmp/libarchive-3.8.1.tar.xz -C /tmp
          cd /tmp/libarchive-3.8.1
          ./configure --disable-shared --enable-static >/dev/null
          make -j2 bsdtar >/dev/null
          ./bsdtar --version
          echo "BSDTAR=/tmp/libarchive-3.8.1/bsdtar" >> "$GITHUB_ENV"

      - name: Reject ad-hoc KPM writers
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import re

          root = pathlib.Path('.github/workflows')
          offenders = []
          pack_workflows = []

          for path in sorted(root.glob('*.y*ml')):
              text = path.read_text(encoding='utf-8')

              # Reading archives for validation is fine. Writing .kpkg files
              # anywhere except tools/kpm-pack.sh is not.
              bad_patterns = [
                  # Short-option GNU tar commands are writers only when the
                  # option cluster includes c (create). -tzf is read-only.
                  r'\btar\s+-[A-Za-z]*c[A-Za-z]*[^\n]*(?:\.kpkg|\|\s*gzip)',
                  r'\btar\s+[^\n]*--create[^\n]*(?:\.kpkg|\|\s*gzip)',
                  r'\btar\s+[^\n]*--format=[^\n]*\|\s*gzip[^\n]*\.kpkg',
                  r'tarfile\.open\([^\n]*["\'][^"\']*w(?::[^"\']*)?["\']',
              ]
              for pattern in bad_patterns:
                  if re.search(pattern, text):
                      offenders.append(f'{path}: {pattern}')

              if '.kpkg' in text and ('Assemble KPM' in text or 'KPM package' in text):
                  pack_workflows.append(path)
                  if 'tools/kpm-pack.sh' not in text:
                      offenders.append(f'{path}: KPM build does not call tools/kpm-pack.sh')

          if offenders:
              raise SystemExit(
                  'ad-hoc KPM package writers are forbidden:\n  - '
                  + '\n  - '.join(offenders)
              )

          print('KPM workflow writer audit OK:', ', '.join(map(str, pack_workflows)))
          PY

      - name: Audit package lifecycle hooks
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            sh -n "$script"
          done < <(find package-src -type f -name '*.sh' -print | sort)

          while IFS= read -r uninstall; do
            if ! grep -Fq '"${1:-}" = "upgrade"' "$uninstall"; then
              echo "$uninstall does not preserve state for KPM 0.2.2 upgrade" >&2
              exit 1
            fi
          done < <(find package-src -mindepth 2 -maxdepth 2 -type f -name uninstall.sh -print | sort)

      - name: Audit repository graph
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = 'feat/kbge-chess' ] ||
             [ "${GITHUB_HEAD_REF:-}" = 'feat/kbge-chess' ]; then
            python tools/audit-repository.py --allow-source-ahead
          else
            python tools/audit-repository.py
          fi

      - name: Validate every committed KPM artifact
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r pkg; do
            found=1
            echo "==> $pkg"
            bash tools/kpm-validate.sh "$pkg"
          done < <(find packages -type f -path '*/artifacts/*.kpkg' -print | sort)
          test "$found" -eq 1
